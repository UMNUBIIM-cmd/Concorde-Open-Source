<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/><stop offset="1" stop-color="#8a0018"/>
    </linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5865f2"/>
    </marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23a559"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#1e1f22"/>
  <text x="450" y="38" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">Arquitetura do Concorde</text>

  <!-- Servidor -->
  <g>
    <rect x="340" y="70" width="220" height="92" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="2"/>
    <text x="450" y="100" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Servidor (Node.js)</text>
    <text x="450" y="122" fill="#b7bbc2" font-size="13" text-anchor="middle">Socket.IO — hospedado no Render</text>
    <text x="450" y="142" fill="#949ba4" font-size="12" text-anchor="middle">sinalização WebRTC + chat de texto</text>
  </g>

  <!-- Usuários -->
  <g>
    <rect x="60"  y="300" width="200" height="96" rx="12" fill="#2b2d31" stroke="#444" stroke-width="1.5"/>
    <rect x="690" y="300" width="200" height="96" rx="12" fill="#2b2d31" stroke="#444" stroke-width="1.5"/>
    <rect x="375" y="330" width="150" height="80" rx="12" fill="#2b2d31" stroke="#444" stroke-width="1.5"/>
    <g transform="translate(78,318)"><rect width="26" height="26" rx="7" fill="url(#g)"/></g>
    <g transform="translate(708,318)"><rect width="26" height="26" rx="7" fill="url(#g)"/></g>
    <g transform="translate(389,348)"><rect width="22" height="22" rx="6" fill="url(#g)"/></g>
    <text x="118" y="336" fill="#fff" font-size="14" font-weight="700">App desktop</text>
    <text x="118" y="356" fill="#949ba4" font-size="12">Electron + React</text>
    <text x="118" y="374" fill="#949ba4" font-size="12">(Pessoa A)</text>
    <text x="748" y="336" fill="#fff" font-size="14" font-weight="700">App desktop</text>
    <text x="748" y="356" fill="#949ba4" font-size="12">Electron + React</text>
    <text x="748" y="374" fill="#949ba4" font-size="12">(Pessoa B)</text>
    <text x="450" y="372" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Pessoa C…</text>
  </g>

  <!-- Linhas até o servidor (sinalização/texto) -->
  <g stroke="#5865f2" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M160 300 L420 162"/>
    <path d="M790 300 L480 162"/>
    <path d="M450 330 L450 162"/>
  </g>
  <rect x="150" y="214" width="200" height="22" rx="6" fill="#1e1f22"/>
  <text x="250" y="230" fill="#8b93f0" font-size="12" text-anchor="middle">texto + sinalização</text>

  <!-- Linha P2P direta entre A e B (mídia) -->
  <path d="M260 352 L690 352" stroke="#23a559" stroke-width="2.5" fill="none" marker-end="url(#am)" marker-start="url(#am)" stroke-dasharray="2 0"/>
  <rect x="375" y="300" width="150" height="20" rx="6" fill="#1e1f22" opacity="0"/>
  <rect x="398" y="408" width="104" height="20" rx="6" fill="#1e1f22"/>
  <text x="450" y="340" fill="#43c47a" font-size="12" text-anchor="middle">voz • vídeo • tela (P2P / WebRTC)</text>

  <text x="450" y="446" fill="#6b7078" font-size="11" text-anchor="middle">Áudio e vídeo vão direto de pessoa para pessoa. O servidor nunca recebe a mídia — só apresenta os participantes e guarda o texto.</text>
</svg>
