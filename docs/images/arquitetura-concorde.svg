<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/><stop offset="1" stop-color="#8a0018"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="blur" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5865f2"/></marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#23a559"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="560" fill="#1e1f22"/>
  <text x="480" y="40" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">Arquitetura do Concorde</text>
  <text x="480" y="64" fill="#949ba4" font-size="13" text-anchor="middle">App desktop · Servidor (Render) · Banco PostgreSQL (Neon)</text>

  <!-- Servidor Render (topo-centro) -->
  <rect x="370" y="104" width="220" height="104" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="2"/>
  <text x="480" y="134" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Servidor (Node.js)</text>
  <text x="480" y="156" fill="#b7bbc2" font-size="12.5" text-anchor="middle">Socket.IO — hospedado no Render</text>
  <text x="480" y="176" fill="#949ba4" font-size="11.5" text-anchor="middle">sinalização WebRTC + chat de texto</text>
  <text x="480" y="193" fill="#949ba4" font-size="11.5" text-anchor="middle">lê/grava o estado no banco</text>

  <!-- Banco Neon (centro-baixo) -->
  <g>
    <ellipse cx="480" cy="300" rx="92" ry="20" fill="#124b45" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M388 300 L388 388 A92 20 0 0 0 572 388 L572 300" fill="#0f3b37" stroke="#2dd4bf" stroke-width="2"/>
    <ellipse cx="480" cy="300" rx="92" ry="20" fill="url(#neon)" opacity="0.25"/>
    <text x="480" y="340" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="480" y="360" fill="#aee9df" font-size="12" text-anchor="middle">Neon (nuvem)</text>
    <text x="480" y="378" fill="#7fccc0" font-size="11" text-anchor="middle">guilds • canais • mensagens • membros</text>
  </g>

  <!-- Apps desktop (cantos de baixo) -->
  <g>
    <rect x="52" y="392" width="226" height="108" rx="12" fill="#2b2d31" stroke="#444" stroke-width="1.5"/>
    <rect x="70" y="410" width="26" height="26" rx="7" fill="url(#red)"/>
    <text x="110" y="420" fill="#fff" font-size="14" font-weight="700">App desktop</text>
    <text x="70" y="456" fill="#b7bbc2" font-size="12">Electron + React (Windows)</text>
    <text x="70" y="476" fill="#949ba4" font-size="11.5">Pessoa A — config.js aponta</text>
    <text x="70" y="492" fill="#949ba4" font-size="11.5">para o endereço do servidor</text>
  </g>
  <g>
    <rect x="682" y="392" width="226" height="108" rx="12" fill="#2b2d31" stroke="#444" stroke-width="1.5"/>
    <rect x="700" y="410" width="26" height="26" rx="7" fill="url(#red)"/>
    <text x="740" y="420" fill="#fff" font-size="14" font-weight="700">App desktop</text>
    <text x="700" y="456" fill="#b7bbc2" font-size="12">Electron + React (Windows)</text>
    <text x="700" y="476" fill="#949ba4" font-size="11.5">Pessoa B</text>
  </g>

  <!-- Links app <-> servidor (sinalização + texto) -->
  <path d="M258 410 L372 196" stroke="#5865f2" stroke-width="2.5" fill="none" marker-end="url(#blur)" marker-start="url(#blur)"/>
  <path d="M702 410 L588 196" stroke="#5865f2" stroke-width="2.5" fill="none" marker-end="url(#blur)" marker-start="url(#blur)"/>
  <rect x="150" y="286" width="196" height="22" rx="6" fill="#1e1f22"/>
  <text x="248" y="302" fill="#8b93f0" font-size="11.5" text-anchor="middle">texto + sinalização (WSS)</text>
  <rect x="612" y="286" width="196" height="22" rx="6" fill="#1e1f22"/>
  <text x="710" y="302" fill="#8b93f0" font-size="11.5" text-anchor="middle">texto + sinalização (WSS)</text>

  <!-- Link servidor <-> banco (SQL) com env var -->
  <path d="M480 210 L480 278" stroke="#2dd4bf" stroke-width="2.5" fill="none" marker-end="url(#teal)" marker-start="url(#teal)"/>
  <rect x="498" y="228" width="196" height="40" rx="8" fill="#1e1f22" stroke="#2dd4bf" stroke-width="1" opacity="0.95"/>
  <text x="596" y="245" fill="#2dd4bf" font-size="11.5" font-weight="700" text-anchor="middle">SQL (driver pg, via SSL)</text>
  <text x="596" y="261" fill="#aee9df" font-size="11" text-anchor="middle">env: DATABASE_URL</text>

  <!-- Link P2P app <-> app (mídia) -->
  <path d="M278 470 L682 470" stroke="#23a559" stroke-width="3" fill="none" marker-end="url(#grn)" marker-start="url(#grn)"/>
  <rect x="356" y="508" width="248" height="22" rx="6" fill="#1e1f22"/>
  <text x="480" y="524" fill="#43c47a" font-size="12" text-anchor="middle">voz • vídeo • tela (P2P / WebRTC)</text>

  <text x="480" y="548" fill="#6b7078" font-size="10.5" text-anchor="middle">O app NUNCA acessa o banco diretamente — só o servidor lê/grava no PostgreSQL. A mídia (voz/vídeo/tela) vai direto entre as pessoas e não passa pelo servidor nem pelo banco.</text>
</svg>
