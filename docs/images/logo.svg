<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.5" stop-color="#e01030"/>
      <stop offset="1" stop-color="#5c0010"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ff6a6a"/>
      <stop offset="1" stop-color="#ff6a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9dd"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#3a0008" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- ondas de choque (boom) atrás, apontando para cima -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.9">
    <path d="M150 300 A120 120 0 0 1 362 300" stroke-width="16" opacity="0.35"/>
    <path d="M185 326 A86 86 0 0 1 327 326" stroke-width="16" opacity="0.55"/>
  </g>
  <!-- jato delta supersônico subindo (nariz afiado, asas em delta) -->
  <g filter="url(#sh)">
    <path d="M256 92
             L330 360
             L256 320
             L182 360 Z" fill="url(#jet)"/>
    <!-- fenda central dando a sensação de fuselagem -->
    <path d="M256 150 L256 300" stroke="#e01030" stroke-width="16" stroke-linecap="round"/>
    <!-- rastro -->
    <path d="M256 372 L256 430" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
