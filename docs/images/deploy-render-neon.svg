<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="Segoe UI, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker>
    <marker id="st" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0b232"/></marker>
  </defs>
  <rect width="980" height="540" fill="#1e1f22"/>
  <text x="490" y="38" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">Configuração e deploy do servidor (Render + Neon)</text>

  <!-- Passo 1: Neon -->
  <rect x="40" y="86" width="270" height="150" rx="12" fill="#13433d" stroke="#2dd4bf" stroke-width="2"/>
  <text x="175" y="114" fill="#2dd4bf" font-size="14" font-weight="700" text-anchor="middle">1 · Neon (banco)</text>
  <text x="60" y="140" fill="#e8f6f3" font-size="12">• Cria conta + projeto</text>
  <text x="60" y="162" fill="#e8f6f3" font-size="12">• Cria/identifica o banco</text>
  <text x="60" y="184" fill="#e8f6f3" font-size="12">• Copia a connection string</text>
  <text x="60" y="206" fill="#aee9df" font-size="11">  (pooled, com sslmode=require)</text>
  <text x="60" y="226" fill="#7fccc0" font-size="11">  → este valor é a DATABASE_URL</text>

  <!-- Passo 2: GitHub -->
  <rect x="355" y="86" width="270" height="150" rx="12" fill="#2b2d31" stroke="#8b93f0" stroke-width="2"/>
  <text x="490" y="114" fill="#8b93f0" font-size="14" font-weight="700" text-anchor="middle">2 · GitHub (código)</text>
  <text x="375" y="140" fill="#e9eaee" font-size="12">• Repositório com a pasta</text>
  <text x="375" y="160" fill="#e9eaee" font-size="12">  server/ (index.js, package.json,</text>
  <text x="375" y="180" fill="#e9eaee" font-size="12">  persistence.js, render.yaml)</text>
  <text x="375" y="204" fill="#f0b232" font-size="11.5" font-weight="700">• SEM credenciais no código</text>
  <text x="375" y="224" fill="#949ba4" font-size="11">  (.env fica fora do Git)</text>

  <!-- Passo 3: Render -->
  <rect x="670" y="86" width="270" height="150" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="2"/>
  <text x="805" y="114" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3 · Render (deploy)</text>
  <text x="690" y="140" fill="#e9eaee" font-size="12">• New + → Blueprint/Web Service</text>
  <text x="690" y="160" fill="#e9eaee" font-size="12">• Branch · Root Dir: server</text>
  <text x="690" y="180" fill="#e9eaee" font-size="12">• Build: npm install</text>
  <text x="690" y="200" fill="#e9eaee" font-size="12">• Start: npm start · Plano Free</text>
  <text x="690" y="222" fill="#949ba4" font-size="11">• PORT é automático no Render</text>

  <!-- seta Neon -> Render (a DATABASE_URL vai como env var) -->
  <path d="M310 150 C330 150 345 300 690 300" stroke="#f0b232" stroke-width="2.5" fill="none" marker-end="url(#st)"/>
  <rect x="360" y="272" width="320" height="42" rx="8" fill="#1e1f22" stroke="#f0b232" stroke-width="1"/>
  <text x="520" y="290" fill="#f0b232" font-size="12" font-weight="700" text-anchor="middle">Cole a DATABASE_URL nas Environment Variables</text>
  <text x="520" y="306" fill="#d8b36a" font-size="11" text-anchor="middle">do Render (Settings → Environment) — nunca no GitHub</text>

  <!-- seta GitHub -> Render (código) -->
  <path d="M625 150 L668 150" stroke="#c9ccd1" stroke-width="2.5" fill="none" marker-end="url(#s)"/>

  <!-- Caixa de resultado: serviço no ar -->
  <rect x="300" y="352" width="380" height="96" rx="12" fill="#2b2d31" stroke="#23a559" stroke-width="2"/>
  <text x="490" y="380" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4 · Deploy → serviço no ar</text>
  <text x="490" y="404" fill="#b7bbc2" font-size="12" text-anchor="middle">Logs: "Servidores restaurados do PostgreSQL: N"</text>
  <text x="490" y="422" fill="#b7bbc2" font-size="12" text-anchor="middle">+ "Concorde server ouvindo na porta ..."</text>
  <text x="490" y="440" fill="#43c47a" font-size="11.5" text-anchor="middle">health check em /  →  "Concorde server online"</text>

  <path d="M805 236 C805 300 680 352 680 390" stroke="#c9ccd1" stroke-width="2" fill="none" marker-end="url(#s)" opacity="0.7"/>

  <!-- endereço para o app -->
  <rect x="300" y="470" width="380" height="44" rx="10" fill="#26282c"/>
  <text x="490" y="490" fill="#c9ccd1" font-size="12" text-anchor="middle" font-weight="700">O endereço público (https://SEU-SERVICO.onrender.com)</text>
  <text x="490" y="507" fill="#949ba4" font-size="11.5" text-anchor="middle">vai no app em config.js (DEFAULT_SERVER_URL) ou na tela de entrada.</text>
</svg>
