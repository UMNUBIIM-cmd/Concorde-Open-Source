<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker>
    <marker id="awt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="620" fill="#1e1f22"/>
  <text x="480" y="38" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">Fluxo de persistência e recuperação dos dados</text>

  <!-- Coluna de operação normal (gravação) -->
  <text x="250" y="76" fill="#8b93f0" font-size="14" font-weight="700" text-anchor="middle">① Durante o uso — gravação</text>

  <rect x="90" y="96" width="320" height="70" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="1.5"/>
  <text x="250" y="124" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Alguém faz uma ação no app</text>
  <text x="250" y="146" fill="#b7bbc2" font-size="11.5" text-anchor="middle">cria canal · envia mensagem · muda perfil/ícone</text>

  <path d="M250 166 L250 196" stroke="#c9ccd1" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="90" y="198" width="320" height="76" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="1.5"/>
  <text x="250" y="226" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Servidor atualiza o estado em memória</text>
  <text x="250" y="248" fill="#b7bbc2" font-size="11.5" text-anchor="middle">e repassa o evento aos outros participantes</text>
  <text x="250" y="264" fill="#949ba4" font-size="11" text-anchor="middle">(emite via Socket.IO em tempo real)</text>

  <path d="M250 274 L250 304" stroke="#2dd4bf" stroke-width="2" marker-end="url(#awt)"/>
  <rect x="268" y="278" width="150" height="22" rx="6" fill="#1e1f22"/>
  <text x="343" y="294" fill="#2dd4bf" font-size="11" text-anchor="middle">persistGuild() →</text>

  <rect x="90" y="306" width="320" height="76" rx="12" fill="#13433d" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="250" y="334" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Grava no PostgreSQL (Neon)</text>
  <text x="250" y="356" fill="#aee9df" font-size="11.5" text-anchor="middle">UPSERT em concorde_guilds e concorde_roster</text>
  <text x="250" y="372" fill="#7fccc0" font-size="11" text-anchor="middle">o estado do servidor vira JSONB no banco</text>

  <!-- Coluna de recuperação (restauração) -->
  <text x="710" y="76" fill="#43c47a" font-size="14" font-weight="700" text-anchor="middle">② Após reinício/hibernação — recuperação</text>

  <rect x="550" y="96" width="320" height="76" rx="12" fill="#2b2d31" stroke="#f0b232" stroke-width="1.5"/>
  <text x="710" y="124" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">O serviço reinicia ou acorda</text>
  <text x="710" y="146" fill="#b7bbc2" font-size="11.5" text-anchor="middle">deploy novo · hibernação do plano free ·</text>
  <text x="710" y="162" fill="#b7bbc2" font-size="11.5" text-anchor="middle">queda do processo — a memória é zerada</text>

  <path d="M710 172 L710 202" stroke="#2dd4bf" stroke-width="2" marker-end="url(#awt)"/>
  <rect x="728" y="176" width="160" height="22" rx="6" fill="#1e1f22"/>
  <text x="808" y="192" fill="#2dd4bf" font-size="11" text-anchor="middle">← restoreGuilds()</text>

  <rect x="550" y="204" width="320" height="76" rx="12" fill="#13433d" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="710" y="232" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Lê tudo do PostgreSQL no boot</text>
  <text x="710" y="254" fill="#aee9df" font-size="11.5" text-anchor="middle">SELECT em concorde_guilds + concorde_roster</text>
  <text x="710" y="270" fill="#7fccc0" font-size="11" text-anchor="middle">antes de aceitar conexões</text>

  <path d="M710 280 L710 310" stroke="#c9ccd1" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="550" y="312" width="320" height="76" rx="12" fill="#2b2d31" stroke="#23a559" stroke-width="1.5"/>
  <text x="710" y="340" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Estado reconstruído em memória</text>
  <text x="710" y="362" fill="#b7bbc2" font-size="11.5" text-anchor="middle">servidores, canais e mensagens voltam</text>
  <text x="710" y="378" fill="#949ba4" font-size="11" text-anchor="middle">as pessoas reconectam e encontram tudo lá</text>

  <!-- banco no centro embaixo conectando as duas colunas -->
  <g>
    <ellipse cx="480" cy="452" rx="100" ry="22" fill="url(#neon2)" opacity="0.3" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M380 452 L380 520 A100 22 0 0 0 580 520 L580 452" fill="#0f3b37" stroke="#2dd4bf" stroke-width="2"/>
    <ellipse cx="480" cy="452" rx="100" ry="22" fill="#124b45" stroke="#2dd4bf" stroke-width="2"/>
    <text x="480" y="492" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL (Neon)</text>
    <text x="480" y="512" fill="#aee9df" font-size="11.5" text-anchor="middle">fonte durável da verdade</text>
  </g>
  <path d="M250 382 C250 430 360 448 382 452" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#awt)" opacity="0.8"/>
  <path d="M578 452 C600 448 710 430 710 388" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#awt)" opacity="0.8"/>

  <rect x="120" y="556" width="720" height="48" rx="10" fill="#26282c"/>
  <text x="480" y="576" fill="#c9ccd1" font-size="12" text-anchor="middle" font-weight="700">O que NÃO é persistido (vive só em memória, por ser efêmero):</text>
  <text x="480" y="594" fill="#949ba4" font-size="11.5" text-anchor="middle">quem está online agora, quem está em cada canal de voz e as conexões WebRTC — recriados quando as pessoas reconectam.</text>
</svg>
